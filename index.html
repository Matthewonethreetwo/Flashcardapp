n cycle is a cycle containing every vertex.\nA connected graph is semi-Hamiltonian if it has a Hamiltonian path, and Hamiltonian if it has a Hamiltonian cycle.","hint":"","page":null},{"id":"k_mt4514_2_14","type":"lemma","label":"Lemma 3.12","front":"Give the necessary condition on $G-S$ for $G$ to have a Hamiltonian cycle.","back":"If $G$ has a Hamiltonian cycle then, for each $S\\subset V(G)$, the graph $G-S$ has at most $|S|$ connected components.","hint":"","page":null},{"id":"k_mt4514_2_15","type":"corollary","label":"Corollary 3.13","front":"If a connected bipartite graph with bipartition $A\\cup B$ is Hamiltonian, what must hold?","back":"$|A|=|B|$.","hint":"So $K_{3,4}$ is not Hamiltonian.","page":null},{"id":"k_mt4514_2_16","type":"theorem","label":"Theorem 3.14 (Dirac's theorem)","front":"State Dirac's theorem.","back":"Let $G$ be a graph with $n\\geq3$ vertices such that every vertex has degree at least $n/2$. Then $G$ has a Hamiltonian cycle.","hint":"Take a longest path $v_1\\dots v_r$; degree counting gives $v_i$ with $v_iv_r$, $v_{i+1}v_1\\in E$, making a cycle, which must be Hamiltonian.","page":null},{"id":"k_mt4514_2_17","type":"theorem","label":"Theorem 3.16 (Ore's Theorem)","front":"State Ore's Theorem.","back":"Let $G$ be a graph with $n\\geq3$ vertices such that for all non-adjacent $v,w$, $\\deg(v)+\\deg(w)\\geq n$. Then $G$ has a Hamiltonian circuit.","hint":"","page":null}],"created":1,"upd":1,"seed":true,"printedPages":true},"c_mt4514_3":{"id":"c_mt4514_3","moduleId":"m_mt4514","title":"4. Trees","start":24,"end":31,"order":3,"cards":[{"id":"k_mt4514_3_1","type":"definition","label":"Definition 1.1","front":"Define acyclic, forest, tree and leaf.","back":"A graph with no cycles is acyclic; an acyclic graph is a forest; a connected acyclic graph is a tree. In a tree or forest a leaf is a vertex of degree one.","hint":"","page":null},{"id":"k_mt4514_3_2","type":"lemma","label":"Lemma 1.2","front":"State the two facts about leaves of a finite tree.","back":"(i) A finite tree with at least two vertices has at least two leaves.\n(ii) Deleting a leaf from an $n$-vertex tree gives an $(n-1)$-vertex tree.","hint":"The endpoints of a maximal path are leaves.","page":null},{"id":"k_mt4514_3_3","type":"definition","label":"Definition 1.3","front":"What is a cut-edge?","back":"An edge of a graph whose deletion disconnects the graph (called a bridge in Fleury's algorithm).","hint":"","page":null},{"id":"k_mt4514_3_4","type":"lemma","label":"Lemma 1.5","front":"Can an edge in a cycle be a cut-edge?","back":"No: any edge contained in a cycle is not a cut-edge.","hint":"Replace the edge by the rest of the cycle.","page":null},{"id":"k_mt4514_3_5","type":"theorem","label":"Theorem 1.6","front":"Give the three equivalent characterisations of a tree on $n$ vertices.","back":"(1) $G$ is connected and acyclic;\n(2) $G$ is connected and has $n-1$ edges;\n(3) $G$ has $n-1$ edges and is acyclic.","hint":"Any two of connected, acyclic and $n-1$ edges imply the third.","page":null},{"id":"k_mt4514_3_6","type":"theorem","label":"Theorem 1.7","front":"Characterise trees in terms of paths between vertices.","back":"$G$ is a tree if and only if any two vertices of $G$ are connected by exactly one path.","hint":"","page":null},{"id":"k_mt4514_3_7","type":"definition","label":"Definition 1.8","front":"Define a spanning tree of a connected graph $G$.","back":"A subgraph $T$ of $G$ which is a tree with $V(T)=V(G)$.","hint":"","page":null},{"id":"k_mt4514_3_8","type":"corollary","label":"Corollary 1.9","front":"State the three parts of Corollary 1.9 about trees.","back":"(1) Each connected graph on $n$ vertices has at least $n-1$ edges and contains a spanning tree.\n(2) Every edge of a tree is a cut-edge.\n(3) Adding an edge to a tree creates precisely one cycle.","hint":"","page":null},{"id":"k_mt4514_3_9","type":"definition","label":"Definition 2.1 (Prüfer code)","front":"How is the Prüfer code of a labelled tree on $n$ vertices built?","back":"Repeatedly delete the leaf $a_i$ with the smallest label and record its unique neighbour $b_i$. After $n-2$ steps one edge $a_{n-1}b_{n-1}$ remains. The Prüfer code is $f(T)=(b_1,\\dots,b_{n-2})$.","hint":"","page":null},{"id":"k_mt4514_3_10","type":"lemma","label":"Lemma 2.3","front":"State the key facts about a Prüfer code $(b_1,\\dots,b_{n-2})$ (which vertices appear, how often, and the first leaf).","back":"(i) $\\{b_1,\\dots,b_{n-2}\\}$ is exactly the set of non-leaf vertices.\n(ii) The first leaf removed, $a_1$, is $\\min(S\\setminus\\{b_1,\\dots,b_{n-2}\\})$.\n(iv) $a_i=\\min\\big(S\\setminus\\{a_1,\\dots,a_{i-1},b_i,\\dots,b_{n-2}\\}\\big)$.\n(v) A vertex of degree $d$ appears $d-1$ times in the code.","hint":"","page":null},{"id":"k_mt4514_3_11","type":"result","label":"Decoding a Prüfer code","front":"How do you recover a tree from its Prüfer code?","back":"Start with the list $L=[1,\\dots,n]$. Join the smallest number in $L$ not in the code to the first number in the code; remove the former from $L$ and the latter from the code. Repeat until two numbers remain in $L$, then join those two.","hint":"","page":null},{"id":"k_mt4514_3_12","type":"theorem","label":"Theorem 2.5 (Cayley's Theorem, 1889)","front":"State Cayley's Theorem.","back":"There are $n^{n-2}$ distinct labelled trees on $n$ vertices.","hint":"The Prüfer code is a bijection from labelled trees on $S$ to $S^{n-2}$.","page":null}],"created":1,"upd":1,"seed":true,"printedPages":true},"c_mt4514_4":{"id":"c_mt4514_4","moduleId":"m_mt4514","title":"5. Matchings and Connectivity","start":32,"end":41,"order":4,"cards":[{"id":"k_mt4514_4_1","type":"definition","label":"Definition 1.3","front":"Define a matching, and perfect, maximal and maximum matchings.","back":"$M\\subseteq E(G)$ is a matching if no two edges of $M$ share a vertex. It is perfect if every vertex is incident with an edge of $M$; maximal if no matching strictly contains it; maximum if no matching has more edges.","hint":"A maximal matching need not be maximum, e.g. the middle edge of $P_4$.","page":null},{"id":"k_mt4514_4_2","type":"definition","label":"Definition 1.5","front":"Define alternating and augmenting paths with respect to a matching $M$.","back":"A path is alternating if, of every two consecutive edges on it, one is in $M$. An alternating path of length at least one is augmenting if its first and last vertices do not belong to any edge of $M$.","hint":"","page":null},{"id":"k_mt4514_4_3","type":"lemma","label":"Lemma 1.6","front":"If $P$ is an augmenting path for a matching $M$, what is $M\\oplus E(P)$?","back":"A matching with $|M\\oplus E(P)|=|M|+1$.","hint":"$S\\oplus T=(S\\setminus T)\\cup(T\\setminus S)$.","page":null},{"id":"k_mt4514_4_4","type":"theorem","label":"Theorem 1.7 (Berge, 1957)","front":"State Berge's theorem.","back":"A matching $M$ is maximum if and only if there is no augmenting path for $M$.","hint":"Components of $M\\oplus M'$ are paths and cycles alternating between $M$ and $M'$; a path with more $M'$-edges is augmenting.","page":null},{"id":"k_mt4514_4_5","type":"theorem","label":"Theorem 1.10 (Hall's Theorem)","front":"State Hall's Theorem.","back":"Let $G$ be bipartite with bipartition $A\\cup B$. Then $G$ has a matching which matches $A$ if and only if for every $S\\subseteq A$, $$|N(S)|\\geq|S|.\\qquad(\\ast)$$","hint":"⇐: take a maximum matching and unmatched $u$; the vertices $X$ reachable by alternating paths satisfy $|N(X)|<|X|$.","page":null},{"id":"k_mt4514_4_6","type":"corollary","label":"Corollary 1.11","front":"What does a $k$-regular bipartite graph ($k\\geq1$) always have?","back":"A perfect matching.","hint":"$|A|=|B|$ by handshaking, and $k|S|\\leq k|N(S)|$ gives Hall's condition.","page":null},{"id":"k_mt4514_4_7","type":"corollary","label":"Corollary 1.12 (defect Hall)","front":"If $|N(S)|\\geq|S|-d$ for every $S\\subseteq A$, what matching exists?","back":"A matching of cardinality $|A|-d$.","hint":"Add $d$ new vertices to $B$ joined to all of $A$.","page":null},{"id":"k_mt4514_4_8","type":"definition","label":"Definition 2.1","front":"Define a spanning subgraph (factor), a $k$-factor and a $k$-factorization.","back":"A spanning subgraph (factor) has $V(G')=V(G)$ and $E(G')\\subseteq E(G)$. A $k$-factor is a $k$-regular spanning subgraph. A $k$-factorization partitions $E(G)$ into disjoint $k$-factors; $G$ is then $k$-factorable.","hint":"","page":null},{"id":"k_mt4514_4_9","type":"lemma","label":"Lemma 2.2","front":"What is a 1-factor, and what does its existence imply about $|V(G)|$?","back":"(i) A 1-factor of $G$ is a perfect matching of $G$.\n(ii) If $G$ has a 1-factor then $|V(G)|$ is even.","hint":"","page":null},{"id":"k_mt4514_4_10","type":"theorem","label":"Theorem 2.4 (Tutte, 1947)","front":"State Tutte's theorem.","back":"$G$ has a perfect matching (1-factor) if and only if for every $S\\subseteq V(G)$, $$q(G-S)\\leq|S|,$$ where $q(H)$ is the number of odd components of $H$.","hint":"Useful for showing a 1-factor does not exist.","page":null},{"id":"k_mt4514_4_11","type":"theorem","label":"Theorem 2.6","front":"When can a bipartite graph be decomposed into $d$ edge-disjoint perfect matchings?","back":"If and only if it is $d$-regular.","hint":"","page":null},{"id":"k_mt4514_4_12","type":"theorem","label":"Theorem 2.7","front":"Which complete graphs are 1-factorable?","back":"(i) $K_{2n+1}$ is not 1-factorable.\n(ii) $K_{2n}$ is 1-factorable.","hint":"Construction: vertices $u,v_0,\\dots,v_{2n-2}$ mod $2n-1$, with $F_i=uv_i\\cup\\{v_{i+k}v_{i-k}:1\\leq k\\leq n-1\\}$.","page":null},{"id":"k_mt4514_4_13","type":"lemma","label":"Lemma 2.8","front":"What is a 2-factor, and what does 2-factorability imply about degrees?","back":"(i) A 2-factor is a disjoint union of cycles using all the vertices.\n(ii) If a graph is 2-factorable, every vertex has even degree.","hint":"","page":null},{"id":"k_mt4514_4_14","type":"theorem","label":"Theorem 2.9 (Petersen, 1891)","front":"State Petersen's theorem on regular graphs of even degree.","back":"(i) Every regular graph of positive even degree has a 2-factor.\n(ii) Every regular graph of positive even degree is 2-factorable.","hint":"Orient an Euler tour, split each $v$ into $v^o,v^i$ to get a $k$-regular bipartite graph, then use Hall.","page":null},{"id":"k_mt4514_4_15","type":"theorem","label":"Theorem 2.10","front":"Which complete graphs are 2-factorable?","back":"(i) $K_{2n}$ is not 2-factorable (all degrees are odd).\n(ii) $K_{2n+1}$ is 2-factorable.","hint":"","page":null},{"id":"k_mt4514_4_16","type":"definition","label":"Definition 3.1","front":"Define an edge colouring and the edge-chromatic number $\\chi_e(G)$.","back":"A map $c:E(G)\\to\\mathbb N$ with $c(e)\\neq c(e')$ whenever distinct edges $e,e'$ share a vertex. $G$ is $k$-edge-colourable if it has an edge colouring with $k$ colours, and $\\chi_e(G)$ is the minimum such $k$.","hint":"An edge colouring is a partition of $E(G)$ into matchings.","page":null},{"id":"k_mt4514_4_17","type":"lemma","label":"Lemma 3.2","front":"Give the simple bounds on $\\chi_e(G)$.","back":"For $G$ with at least one edge, $$\\Delta(G)\\leq\\chi_e(G)\\leq2\\Delta(G)-1.$$","hint":"Greedy: each edge meets at most $2\\Delta-2$ others.","page":null},{"id":"k_mt4514_4_18","type":"theorem","label":"Theorem 3.3 (Vizing's theorem)","front":"State Vizing's theorem.","back":"For a simple graph $G$, $$\\Delta(G)\\leq\\chi_e(G)\\leq\\Delta(G)+1.$$","hint":"","page":null},{"id":"k_mt4514_4_19","type":"theorem","label":"Theorem 3.5","front":"What is $\\chi_e(G)$ for a bipartite graph $G$?","back":"$\\chi_e(G)=\\Delta(G)$.","hint":"Embed in a $\\Delta$-regular bipartite graph, remove a perfect matching as one colour, and induct.","page":null},{"id":"k_mt4514_4_20","type":"theorem","label":"Theorem 3.6","front":"What is $\\chi_e(K_n)$ for $n>1$?","back":"$\\chi_e(K_n)=n$ if $n$ is odd, and $\\chi_e(K_n)=n-1$ if $n$ is even.","hint":"E.g. the Six Nations ($K_6$) needs $5$ rounds.","page":null}],"created":1,"upd":1,"seed":true,"printedPages":true},"c_mt4514_5":{"id":"c_mt4514_5","moduleId":"m_mt4514","title":"6. Planarity and Colouring","start":42,"end":53,"order":5,"cards":[{"id":"k_mt4514_5_1","type":"definition","label":"Definition 2.1","front":"When is a graph planar?","back":"If it has a drawing in the plane without crossings. The image of such a drawing is a planar drawing (embedding).","hint":"","page":null},{"id":"k_mt4514_5_2","type":"lemma","label":"Lemma 2.5","front":"When is an edge on the boundary of only one face?","back":"If and only if it is a cut-edge.","hint":"","page":null},{"id":"k_mt4514_5_3","type":"lemma","label":"Lemma 2.8 (Handshaking Lemma for Planar Graphs)","front":"State the Handshaking Lemma for planar graphs.","back":"For a planar drawing $D$ of $G$, with $\\ell(f_i)$ the length of face $f_i$, $$\\sum\\ell(f_i)=2|E(G)|.$$","hint":"Every edge is counted twice.","page":null},{"id":"k_mt4514_5_4","type":"theorem","label":"Theorem 2.9 (Euler's Formula)","front":"State Euler's Formula.","back":"If $G$ is a connected planar graph with planar drawing $D$, $$|V(G)|-|E(G)|+|F_D(G)|=2.$$","hint":"Induction on $|E(G)|$: trees give the base case; otherwise delete a cycle edge, which merges two faces.","page":null},{"id":"k_mt4514_5_5","type":"definition","label":"Definition 2.11","front":"When is a graph 2-connected?","back":"A connected graph with at least 3 vertices such that $G-v$ is connected for every $v\\in V(G)$.","hint":"In a 2-connected plane graph every face is bounded by a cycle (Lemma 2.12).","page":null},{"id":"k_mt4514_5_6","type":"corollary","label":"Corollaries 2.13, 2.14","front":"Which two small graphs are non-planar, and how does Euler's Formula show it?","back":"$K_5$: a drawing would have $f=7$ faces, but $2e\\geq3f$ gives $f\\leq20/3<7$.\n$K_{3,3}$: $f=5$, but with no odd cycles every face has length $\\geq4$, so $f\\leq18/4<5$.","hint":"","page":null},{"id":"k_mt4514_5_7","type":"corollary","label":"Corollary 2.15","front":"Give the edge bound for a planar graph with $|V(G)|\\geq3$.","back":"$$|E(G)|\\leq3|V(G)|-6.$$","hint":"Add edges until maximally planar; then every face is a triangle, so $2e=3f$.","page":null},{"id":"k_mt4514_5_8","type":"corollary","label":"Corollary 2.16","front":"What degree must some vertex of a connected planar graph have?","back":"Every connected planar graph has at least one vertex of degree less than $6$.","hint":"","page":null},{"id":"k_mt4514_5_9","type":"theorem","label":"Theorem 2.17 (Kuratowski's Theorem)","front":"State Kuratowski's Theorem.","back":"A finite connected graph is planar if and only if it does not have $K_{3,3}$ or $K_5$ as a topological minor. Equivalently, $G$ is non-planar iff it has a subgraph which is a subdivision of $K_{3,3}$ or $K_5$.","hint":"E.g. the Petersen graph is non-planar.","page":null},{"id":"k_mt4514_5_10","type":"definition","label":"Definition 3.1","front":"Define a vertex colouring and the chromatic number $\\chi(G)$.","back":"A map $c:V(G)\\to\\mathbb N$ with $c(u)\\neq c(v)$ whenever $uv\\in E(G)$. $G$ is $k$-colourable if it has a vertex colouring with $k$ colours, and $\\chi(G)$ is the minimum such $k$.","hint":"","page":null},{"id":"k_mt4514_5_11","type":"theorem","label":"Theorem 3.4 (Four Colour Theorem)","front":"State the Four Colour Theorem.","back":"Every planar graph is four-colourable.","hint":"","page":null},{"id":"k_mt4514_5_12","type":"proposition","label":"Proposition 3.6","front":"Give the greedy upper bound on $\\chi(G)$.","back":"$\\chi(G)\\leq\\Delta(G)+1$.","hint":"Tight for odd cycles and complete graphs.","page":null},{"id":"k_mt4514_5_13","type":"theorem","label":"Theorem 3.7 (Brooks' Theorem)","front":"State Brooks' Theorem.","back":"If $G$ is connected and is not a complete graph or an odd cycle, then $\\chi(G)\\leq\\Delta(G)$.","hint":"","page":null},{"id":"k_mt4514_5_14","type":"definition","label":"Definition 4.1","front":"Define the chromatic polynomial $P_G(k)$ and relate it to $\\chi(G)$.","back":"$P_G(k)$ is the number of $k$-colourings of $G$ (vertices fixed, colours significant). $\\chi(G)$ is the least positive integer $k$ with $P_G(k)\\neq0$.","hint":"","page":null},{"id":"k_mt4514_5_15","type":"equation","label":"Example 4.3","front":"Give $P_G(k)$ for $K_3$, $K_n$ and the empty graph on $n$ vertices.","back":"$P_{K_3}(k)=k(k-1)(k-2)$\n$P_{K_n}(k)=k(k-1)(k-2)\\cdots(k-n+1)$\nEmpty graph: $k^n$.","hint":"","page":null},{"id":"k_mt4514_5_16","type":"theorem","label":"Theorem 4.4","front":"What is $P_G(k)$ if $G$ has components $G_1,\\dots,G_k$?","back":"$P_G(k)=P_{G_1}(k)\\times\\cdots\\times P_{G_k}(k)$.","hint":"","page":null},{"id":"k_mt4514_5_17","type":"lemma","label":"Lemma 4.5 (Deletion/Contraction Lemma)","front":"State the Deletion/Contraction Lemma.","back":"Let $vw$ be an edge of $G$, $G_1$ the graph with $vw$ deleted and $G_2$ the graph with $vw$ contracted. Then $$P_G(k)=P_{G_1}(k)-P_{G_2}(k).$$","hint":"Colourings of $G_1$ either give $v,w$ the same colour (count $P_{G_2}$) or different colours (count $P_G$).","page":null},{"id":"k_mt4514_5_18","type":"corollary","label":"Corollary 4.6","front":"List the six properties of the chromatic polynomial $P_G(k)$.","back":"(i) It is a polynomial in $k$;\n(ii) its degree is $|V(G)|$;\n(iii) it is monic;\n(iv) it has no constant term;\n(v) its terms alternate in sign;\n(vi) the coefficient of $k^{|V(G)|-1}$ is $-|E(G)|$.","hint":"","page":null},{"id":"k_mt4514_5_19","type":"theorem","label":"Theorem 4.8","front":"What is the chromatic polynomial of a tree on $n$ vertices?","back":"$P_T(k)=k(k-1)^{n-1}$.","hint":"","page":null},{"id":"k_mt4514_5_20","type":"theorem","label":"Theorem 4.9","front":"What is the chromatic polynomial of the cycle $C_n$?","back":"$$P_{C_n}(k)=(k-1)^n+(k-1)(-1)^n.$$","hint":"Induction: deleting an edge of $C_{n+1}$ gives $P_{n+1}$, contracting it gives $C_n$.","page":null}],"created":1,"upd":1,"seed":true,"printedPages":true},"c_mt4514_6":{"id":"c_mt4514_6","moduleId":"m_mt4514","title":"7. Ramsey Theory","start":54,"end":60,"order":6,"cards":[{"id":"k_mt4514_6_1","type":"theorem","label":"Theorem 1.2 (Mantel, 1907)","front":"State Mantel's Theorem.","back":"A triangle-free graph on $n$ vertices has at most $\\left\\lfloor\\dfrac{n^2}{4}\\right\\rfloor$ edges.","hint":"With $d=\\Delta(G)$, the neighbourhood of a max-degree vertex has no internal edges, so $|E|\\leq d(n-d)\\leq n^2/4$. Attained by $K_{\\lceil n/2\\rceil,\\lfloor n/2\\rfloor}$.","page":null},{"id":"k_mt4514_6_2","type":"theorem","label":"Theorem 1.3 (Turán)","front":"State Turán's Theorem.","back":"Let $G$ have $n$ vertices and $e$ edges. If $$e>\\frac{n^2}{2}\\left(1-\\frac1r\\right)$$ then $G$ contains $K_{r+1}$ as a subgraph.","hint":"","page":null},{"id":"k_mt4514_6_3","type":"theorem","label":"Theorem 2.1","front":"What must every graph on six vertices contain?","back":"Either a triangle of edges or a triangle of non-edges.","hint":"A vertex has at least three neighbours or three non-neighbours (pigeonhole).","page":null},{"id":"k_mt4514_6_4","type":"definition","label":"Definition 3.1","front":"Define the Ramsey number $R(m,n)$.","back":"The least integer such that, whenever all edges of $K_{R(m,n)}$ are coloured red or blue, there is either a red $K_m$ or a blue $K_n$.","hint":"The order of colours matters.","page":null},{"id":"k_mt4514_6_5","type":"theorem","label":"Theorem 3.2","front":"What is $R(3,3)$ and why?","back":"$R(3,3)=6$: Theorem 2.1 gives $R(3,3)\\leq6$, and colouring the two 5-cycles of a 2-factorization of $K_5$ red and blue gives no monochromatic triangle.","hint":"","page":null},{"id":"k_mt4514_6_6","type":"proposition","label":"Proposition 3.3","front":"State the three basic facts about Ramsey numbers.","back":"(i) $R(m,n)=R(n,m)$;\n(ii) $R(n,1)=1$;\n(iii) $R(2,n)=n$ for $n\\geq2$.","hint":"","page":null},{"id":"k_mt4514_6_7","type":"theorem","label":"Theorem 3.4 (Ramsey's Theorem for Graphs)","front":"State Ramsey's Theorem and the recursive bound used to prove it.","back":"For all $m,n\\in\\mathbb N$, $R(m,n)$ is finite. For $m,n>1$, $$R(m,n)\\leq R(m,n-1)+R(m-1,n).$$","hint":"Split the other vertices by the colour of their edge to $v$; one side is big enough to recurse.","page":null},{"id":"k_mt4514_6_8","type":"corollary","label":"Corollary 3.6","front":"When can the Ramsey recursion be improved by $1$?","back":"If $R(m-1,n)$ and $R(m,n-1)$ are both even, then $$R(m,n)\\leq R(m-1,n)+R(m,n-1)-1.$$","hint":"Otherwise the red graph would have an odd number of vertices, all of odd degree, contradicting handshaking.","page":null},{"id":"k_mt4514_6_9","type":"corollary","label":"Corollary 3.7","front":"Give the non-recursive upper bound on $R(m,n)$.","back":"$$R(m,n)\\leq\\frac{(m+n-2)!}{(m-1)!(n-1)!}=\\binom{m+n-2}{m-1}.$$","hint":"","page":null},{"id":"k_mt4514_6_10","type":"equation","label":"Theorem 3.8","front":"What are $R(3,4)$, $R(3,5)$ and $R(4,4)$?","back":"$R(3,4)=9$, $R(3,5)=14$, $R(4,4)=18$.","hint":"","page":null},{"id":"k_mt4514_6_11","type":"theorem","label":"Theorem 3.9","front":"Define $R_k(s_1,\\dots,s_k)$ and state its recursive bound.","back":"$R_k(s_1,\\dots,s_k)$ is the least $N$ such that whenever the edges of $K_N$ are coloured with $k$ colours, there is a $K_{s_i}$ of colour $i$ for some $i$. It satisfies $$R_k(s_1,\\dots,s_k)\\leq R_k(s_1-1,\\dots,s_k)+\\cdots+R_k(s_1,\\dots,s_k-1),$$ so is finite.","hint":"","page":null},{"id":"k_mt4514_6_12","type":"corollary","label":"Corollary 3.10 (Schur)","front":"State Schur's theorem.","back":"For every integer $k$ there exists $N$ such that if $\\{1,\\dots,N\\}$ is coloured with $k$ colours, there is a monochromatic solution to $x+y=z$ ($x=y$ allowed).","hint":"Take $N=R_k(3,\\dots,3)-1$ and colour edge $ij$ of $K_{N+1}$ by the colour of $|i-j|$.","page":null}],"created":1,"upd":1,"seed":true,"printedPages":true}}};

const LS='lemma_v1';

(function loadCache(){const c=lsGet(LS);if(c){S.modules=c.modules||{};S.chapters=c.chapters||{};S.stats=Object.assign(S.stats,c.stats||{});}})();

function applySeed(){
  if(!SEED)return;
  let ids=Array.isArray(S.stats.seededIds)?S.stats.seededIds.slice():(S.stats.seeded?['m_mt3501','m_mt3507','m_mt3504']:[]);
  const added=[];
  for(const mid in SEED.modules){
    if(ids.includes(mid))continue;
    if(!S.modules[mid])S.modules[mid]=clean(SEED.modules[mid]);
    for(const cid in SEED.chapters)if(SEED.chapters[cid].moduleId===mid&&!S.chapters[cid])S.chapters[cid]=clean(SEED.chapters[cid]);
    ids.push(mid);added.push(SEED.modules[mid].name);
  }
  S.stats.seededIds=ids;S.stats.seeded=true;
  if(added.length){cache();if(ids.length>added.length)setTimeout(()=>toast('New cards added: '+added.join(', ')),600);}
}

/* ---------- runtime: Claude (db + sample) or standalone ---------- */
let DB=null,SAMPLE=null,dbMode='connecting',RUNTIME=false;
const API_KEY='lemma_api_key',API_MODEL='lemma_api_model',DEFAULT_MODEL='claude-sonnet-5-5';
function apiSample(){
  let key='';try{key=localStorage.getItem(API_KEY)||'';}catch(e){}
  if(!key)return null;
  return async(prompt)=>{
    let model=DEFAULT_MODEL;try{model=localStorage.getItem(API_MODEL)||DEFAULT_MODEL;}catch(e){}
    let r;
    try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model,max_tokens:16000,messages:[{role:'user',content:prompt}]})});}
    catch(e){throw{code:'network',message:'couldn\u2019t reach the Anthropic API. Check your connection'};}
    if(!r.ok){let t='';try{t=(await r.json()).error.message;}catch(e){}throw{code:r.status===429?'rate_limited':'api',message:`the API returned ${r.status}${t?': '+t:''}`};}
    const d=await r.json();
    return{text:(d.content||[]).map(c=>c.text||'').join(''),truncated:d.stop_reason==='max_tokens'};
  };
}
const wq={};
function setSync(s){if(s)dbMode=s;const m={connecting:'Connecting\u2026',local:'Saved on this device',saving:'Saving\u2026',saved:'Saved',error:'Not synced, retrying'};$('#sync').textContent=m[dbMode]||'';}
function dbWrite(path,val){const e=wq[path]||(wq[path]={pending:undefined,busy:false});e.pending=val===null?{del:true}:{val:clean(val)};if(DB&&!e.busy)flushPath(path);}
async function flushPath(path){
  const e=wq[path];e.busy=true;
  while(e.pending!==undefined){
    const job=e.pending;e.pending=undefined;setSync('saving');
    try{job.del?await DB.doc(path).delete():await DB.doc(path).set(job.val);setSync('saved');}
    catch(err){console.warn('write failed',path,err);setSync('error');if(e.pending===undefined)e.pending=job;await sleep(4000);}
  }
  e.busy=false;
}
function unwrapDoc(d){if(!d)return null;if(typeof d.data==='function')return d.data();if(d.data&&typeof d.data==='object'&&!Array.isArray(d.data))return d.data;return d;}
async function listCol(name){const r=await DB.collection(name).get();const arr=Array.isArray(r)?r:(r&&(r.docs||r.items||r.documents))||[];return arr.map(d=>({id:d.id||d.doc_id||(d.ref&&d.ref.id)||(unwrapDoc(d)||{}).id,data:unwrapDoc(d)})).filter(x=>x.id&&x.data);}
async function getDoc(path){try{return unwrapDoc(await DB.doc(path).get());}catch(e){return null;}}

async function initRuntime(){
  setSync('connecting');
  for(let i=0;i<25&&!(window.claude&&window.claude.use);i++)await sleep(100);
  if(!(window.claude&&window.claude.use)){RUNTIME=false;SAMPLE=apiSample();setSync('local');render();return;}
  RUNTIME=true;
  claude.use('sample').then(s=>{SAMPLE=s||null;render();}).catch(()=>{});
  let d=null;try{d=await claude.use('db');}catch(e){}
  if(!d){setSync('local');render();return;}
  DB=d;
  try{
    const [mods,chs,st]=await Promise.all([listCol('modules'),listCol('chapters'),getDoc('stats/main')]);
    const merge=(local,remote,col)=>{
      const out={...local};const rmap={};
      for(const r of remote){rmap[r.id]=r.data;const l=local[r.id];if(!l||(r.data.upd||0)>=(l.upd||0))out[r.id]={...r.data,id:r.id};}
      for(const id in local){if(!rmap[id]||(local[id].upd||0)>(rmap[id].upd||0))dbWrite(col+'/'+id,local[id]);}
      return out;
    };
    S.modules=merge(S.modules,mods,'modules');
    S.chapters=merge(S.chapters,chs,'chapters');
    if(st){const days={...(st.days||{})};for(const k in S.stats.days){const a=S.stats.days[k],b=days[k]||{};days[k]={reviews:Math.max(a.reviews||0,b.reviews||0),new:Math.max(a.new||0,b.new||0)};}S.stats={...S.stats,...st,days,seeded:true,seededIds:[...new Set([...(S.stats.seededIds||[]),...(st.seededIds||[])])]};}
    dbWrite('stats/main',S.stats);
    cache();setSync('saved');
    for(const p in wq)if(wq[p].pending!==undefined&&!wq[p].busy)flushPath(p);
  }catch(e){console.warn(e);DB=null;setSync('local');}
  render();
}

function putModule(m){m.upd=Date.now();S.modules[m.id]=m;cache();dbWrite('modules/'+m.id,m);}
function putChapter(c){c.upd=Date.now();S.chapters[c.id]=c;cache();dbWrite('chapters/'+c.id,c);}
const chT={};function putChapterSoon(c){c.upd=Date.now();cache();clearTimeout(chT[c.id]);chT[c.id]=setTimeout(()=>{delete chT[c.id];dbWrite('chapters/'+c.id,c);},1200);}
let stT;function putStats(){cache();clearTimeout(stT);stT=setTimeout(()=>dbWrite('stats/main',S.stats),1500);}
function flushSoon(){for(const id in chT){clearTimeout(chT[id]);const c=S.chapters[id];if(c)dbWrite('chapters/'+id,c);delete chT[id];}}
function putText(id,t){S.texts[id]=t;try{localStorage.setItem('lemma_text_'+id,t);}catch(e){}dbWrite('texts/'+id,{text:t.slice(0,180000)});}
async function getText(id){
  if(S.texts[id])return S.texts[id];
  try{const t=localStorage.getItem('lemma_text_'+id);if(t){S.texts[id]=t;return t;}}catch(e){}
  if(DB){const d=await getDoc('texts/'+id);if(d&&d.text){S.texts[id]=d.text;return d.text;}}
  return null;
}
function delChapter(id){delete S.chapters[id];delete S.texts[id];try{localStorage.removeItem('lemma_text_'+id);}catch(e){}cache();dbWrite('chapters/'+id,null);dbWrite('texts/'+id,null);}
function delModule(id){for(const c of chaptersOf(id))delChapter(c.id);delete S.modules[id];cache();dbWrite('modules/'+id,null);}

/* ---------- queries ---------- */
const modulesSorted=()=>Object.values(S.modules).sort((a,b)=>(a.created||0)-(b.created||0));
const chaptersOf=mid=>Object.values(S.chapters).filter(c=>c.moduleId===mid).sort((a,b)=>(a.order-b.order)||(a.start-b.start));
function dayStat(){const k=keyOf(today());return S.stats.days[k]||(S.stats.days[k]={reviews:0,new:0});}
function buildQueue(f={}){
  const t=today(),due=[],perMod=[];
  for(const m of modulesSorted()){
    if(f.moduleId&&m.id!==f.moduleId)continue;
    const mf=[];
    for(const c of chaptersOf(m.id)){
      if(f.chapterId&&c.id!==f.chapterId)continue;
      for(const k of c.cards||[]){if(k.sr){if(k.sr.due<=t)due.push({ch:c.id,id:k.id,d:k.sr.due});}else mf.push({ch:c.id,id:k.id});}
    }
    if(mf.length)perMod.push(mf);
  }
  const fresh=[];for(let i=0;perMod.some(a=>i<a.length);i++)for(const a of perMod)if(i<a.length)fresh.push(a[i]);
  due.sort((a,b)=>a.d-b.d);
  const left=Math.max(0,(S.stats.newPerDay??20)-(dayStat().new||0));
  const nf=fresh.slice(0,left);
  return{items:[...due,...nf],due:due.length,fresh:nf.length};
}
function countCards(chs){let n=0;for(const c of chs)n+=(c.cards||[]).length;return n;}
function streak(){let n=0,d=today();if(!(S.stats.days[keyOf(d)]||{}).reviews)d--;while((S.stats.days[keyOf(d)]||{}).reviews){n++;d--;}return n;}
function findCard(it){const c=S.chapters[it.ch];if(!c)return[null,null];return[c,(c.cards||[]).find(k=>k.id===it.id)];}

/* ---------- spaced repetition ---------- */
function nextSr(sr,g){
  const t=today();let{interval=0,ease=2.5,reps=0,lapses=0}=sr||{};
  if(g===0){reps=0;lapses++;ease=Math.max(1.3,ease-0.2);interval=0;}
  else{
    if(reps===0)interval=[0,1,1,3][g];
    else if(reps===1)interval=[0,2,3,6][g];
    else interval=Math.max(interval+1,Math.round(interval*(g===1?1.2:g===2?ease:ease*1.3)));
    if(g===1)ease=Math.max(1.3,ease-0.15);if(g===3)ease+=0.15;reps++;
  }
  return{interval,ease:+ease.toFixed(2),reps,lapses,due:t+interval,last:t};
}
function fmtIv(n){if(n<=0)return'today';if(n===1)return'1 day';if(n<31)return n+' days';if(n<365)return Math.round(n/30)+' mo';return(n/365).toFixed(1)+' yr';}
function fmtDue(d){const n=d-today();return n<=0?'today':n===1?'tomorrow':'in '+fmtIv(n);}

/* ---------- multiple choice ---------- */
const GRADUATE=2;
const styleSetting=()=>S.stats.style||'auto';
function isLearning(k){return !(k.sr&&k.sr.reps>=GRADUATE);}
function wantsChoices(k){const s=styleSetting();if(s==='flip')return false;if(s==='mc')return true;return isLearning(k);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const kindOf=t=>['theorem','lemma','proposition','corollary'].includes(t)?'thm':t==='definition'?'def':'eq';
function buildChoices(c,k){
  const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
  const seen=new Set([norm(k.back)]);const picked=[];
  const modCards=chaptersOf(c.moduleId).flatMap(ch=>ch.cards||[]);
  const same=x=>kindOf(x.type)===kindOf(k.type);
  const pools=[(c.cards||[]).filter(same),modCards.filter(same),c.cards||[],modCards];
  for(const pool of pools){
    for(const x of shuffle(pool.slice())){
      if(picked.length>=3)break;
      const b=norm(x.back);if(x.id===k.id||!b||seen.has(b))continue;
      seen.add(b);picked.push(x.back);
    }
    if(picked.length>=3)break;
  }
  if(picked.length<3)return null;
  return shuffle([{t:k.back,ok:true},...picked.map(t=>({t,ok:false}))]);
}

/* ---------- reading files ---------- */
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Couldn\u2019t load the PDF reader. Check your connection and try again.'));document.head.appendChild(s);});}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function readPdf(file,onp){
  await loadScript(PDFJS+'pdf.min.js');await loadScript(PDFJS+'pdf.worker.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise;
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const tc=await (await pdf.getPage(i)).getTextContent();let s='';
    for(const it of tc.items){s+=it.str||'';s+=it.hasEOL?'\n':' ';}
    pages.push(s.replace(/[ \t]+/g,' ').replace(/ ?\n ?/g,'\n').trim());onp(i/pdf.numPages,`Reading page ${i} of ${pdf.numPages}\u2026`);
  }
  return pages;
}
async function readText(file){const t=await file.text();const parts=t.split('\f');if(parts.length>1)return parts;const pages=[];let cur='';for(const l of t.split('\n')){cur+=l+'\n';if(cur.length>2500){pages.push(cur);cur='';}}if(cur.trim())pages.push(cur);return pages;}
function chapterText(pages,s,e){return pages.slice(s-1,e).map((t,i)=>`[page ${s+i}]\n${t}`).join('\n\n');}

/* ---------- talking to Claude ---------- */
function fixLatexEscapes(s){
  let out='',inStr=false;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(!inStr){out+=ch;if(ch==='"')inStr=true;continue;}
    if(ch==='"'){out+=ch;inStr=false;continue;}
    if(ch==='\\'){
      const c=s[i+1]||'';
      if(c==='"'||c==='\\'||c==='/'){out+=ch+c;i++;continue;}
      if(c==='u'&&/^[0-9a-fA-F]{4}$/.test(s.substr(i+2,4))){out+=ch;continue;}
      if(c&&'bfnrt'.includes(c)&&!/[a-zA-Z]/.test(s[i+2]||'')){out+=ch;continue;}
      out+='\\\\';continue;
    }
    if(ch==='\n'){out+='\\n';continue;}
    if(ch==='\t'){out+=' ';continue;}
    out+=ch;
  }
  return out;
}
function parseLoose(t){
  t=String(t||'').replace(/```(?:json)?/g,'');const a=t.indexOf('{');if(a<0)throw new Error('the reply had no card data');
  const body=fixLatexEscapes(t.slice(a));
  try{return JSON.parse(body.slice(0,body.lastIndexOf('}')+1));}
  catch(e){let k=body.lastIndexOf('}'),tries=0;while(k>0&&tries++<300){try{return JSON.parse(body.slice(0,k+1)+']}');}catch(_){}k=body.lastIndexOf('}',k-1);}throw new Error('the reply couldn\u2019t be read');}
}
async function ask(prompt,onText){
  if(!SAMPLE)throw new Error(RUNTIME?'the Claude connection isn\u2019t available here':'no API key is saved');
  try{const r=await SAMPLE(prompt,{modelTier:'default',cache:false,onText:onText?e=>onText(e.text||''):undefined});return r.text||'';}
  catch(e){
    if(e&&e.text)return e.text;
    const code=e&&e.code;
    if(code==='not_granted')throw new Error('Claude access wasn\u2019t allowed for this page');
    if(code==='rate_limited')throw new Error('too many requests right now, try again in a few minutes');
    throw new Error((e&&e.message)||'the request failed');
  }
}
function outline(pages){
  let out='';
  pages.forEach((p,i)=>{const lines=p.split('\n').map(s=>s.trim()).filter(Boolean);
    const head=lines.slice(0,3).join(' | ').slice(0,160);
    const hs=lines.filter(l=>l.length<90&&/^(chapter|part|section|appendix|\d{1,2}(\.\d{1,2})?\.?\s+[A-Z])/i.test(l)).slice(0,5).join(' | ').slice(0,260);
    out+=`[p${i+1}] ${head}${hs?' || '+hs:''}\n`;});
  return out.slice(0,70000);
}
async function detectChapters(d){
  const n=d.pages.length;
  const front=d.pages.slice(0,6).map((t,i)=>`[p${i+1}]\n${t}`).join('\n').slice(0,14000);
  const prompt=`You are splitting a PDF of university mathematics lecture notes into chapters. Module: "${d.name}". The PDF has ${n} pages.

Below is an outline: for each PDF page [pN], its first lines and any heading-like lines. After that is the full text of the first few pages, which usually include a table of contents.

Rules:
- Use the notes' top-level chapters (for example "Chapter 2 Linear maps" or "2 Linear maps"). If the notes have no chapters, use their top-level sections.
- Page numbers are PDF page numbers as in [pN], not the printed page numbers.
- Chapters must be in order, contiguous and non-overlapping. Leave out the title page, contents, index and bibliography.
- Keep the notes' chapter number in the title, e.g. "2. Linear maps".

Respond with only a JSON object, no commentary and no code fences:
{"chapters":[{"title":"1. Introduction","start":3,"end":12}]}

OUTLINE:
${outline(d.pages)}

FIRST PAGES:
${front}`;
  const obj=parseLoose(await ask(prompt,null));
  const chs=(obj.chapters||[]).map(c=>({title:String(c.title||'Untitled').trim(),start:Math.max(1,Math.min(n,parseInt(c.start)||1)),end:Math.max(1,Math.min(n,parseInt(c.end)||n))})).filter(c=>c.end>=c.start).sort((a,b)=>a.start-b.start);
  if(!chs.length)throw new Error('no chapters found');
  return chs;
}

const genQueue=[],genStatus={};let genRunning=false;
function queueGen(id){const c=S.chapters[id];if(!c||!SAMPLE||genQueue.includes(id))return;genQueue.push(id);genStatus[id]='Waiting to make cards\u2026';render();runGen();}
async function runGen(){
  if(genRunning)return;genRunning=true;
  while(genQueue.length){
    const id=genQueue[0];
    try{await generate(id);}
    catch(e){const c=S.chapters[id];if(c){c.error=String(e.message||e);putChapter(c);}toast('Couldn\u2019t make cards for '+(c?c.title:'a chapter'));}
    genQueue.shift();delete genStatus[id];render();
  }
  genRunning=false;
}
function setStatus(id,msg){genStatus[id]=msg;const el=document.querySelector(`[data-status="${id}"]`);if(el)el.textContent=msg;}
function splitParts(text,size){
  const chunks=text.split(/\n\n(?=\[page \d+\])/);const parts=[];let cur='';
  for(const c of chunks){if(cur&&cur.length+c.length>size){parts.push(cur);cur='';}cur+=(cur?'\n\n':'')+c;}
  if(cur)parts.push(cur);return parts;
}
function cardPrompt(m,c,text,i,n,prev){
  return`You are writing revision flashcards for a third-year university mathematics student.
Module: ${m?m.name:''}
Chapter: ${c.title} (PDF pages ${c.start}\u2013${c.end})${n>1?`, part ${i+1} of ${n}`:''}

Below is text extracted from the lecture notes PDF. Extraction garbles mathematical symbols, subscripts, fractions and layout, so reconstruct the correct mathematics. Follow the notes' own definitions, notation, conventions and numbering exactly: the notes are the authority, not general conventions.

Make one card for every:
- definition
- theorem, lemma, proposition and corollary
- key equation or formula
- other important result stated in the notes (named inequalities, criteria, standard results, solution methods)
Skip worked examples, exercises and full proofs. When the notes prove a result, a card's "hint" may give the idea of the proof in one or two sentences.

Each card has:
- "type": one of definition, theorem, lemma, proposition, corollary, equation, result
- "label": the notes' number and name, e.g. "Theorem 3.4 (Cayley\u2013Hamilton)" or "Definition 2.1"; just the name if unnumbered
- "front": a question that prompts recall without giving the answer away, e.g. "State the Cayley\u2013Hamilton theorem." or "Define an eigenvalue of a linear map." or "Write down the formula for ..."
- "back": the complete, precise answer as in the notes, with all hypotheses
- "hint": a short proof idea or "" if none
- "page": the [page N] number it appears on

Maths: use LaTeX with $...$ inline and $$...$$ for displayed maths. The output is JSON, so write every LaTeX backslash doubled, e.g. "$\\\\frac{a}{b}$". For a line break (e.g. between conditions (i), (ii)) write \\n followed by a space.
${prev.length?`Cards already made from earlier parts of this chapter (don't repeat them): ${prev.join('; ')}\n`:''}
Respond with only a JSON object, no commentary and no code fences:
{"cards":[{"type":"theorem","label":"...","front":"...","back":"...","hint":"...","page":12}]}

NOTES TEXT:
${text}`;
}
async function generate(id){
  const c=S.chapters[id];if(!c)return;const m=S.modules[c.moduleId];
  setStatus(id,'Loading notes\u2026');
  const text=await getText(id);
  if(!text)throw new Error('the notes text for this chapter is missing. Upload the notes again');
  const parts=splitParts(text,32000);const made=[];
  for(let i=0;i<parts.length;i++){
    const pl=parts.length>1?` (part ${i+1} of ${parts.length})`:'';
    setStatus(id,`Reading${pl}\u2026`);
    const raw=await ask(cardPrompt(m,c,parts[i],i,parts.length,made.map(k=>k.label||k.front).slice(-80)),t=>{const k=(t.match(/"front"/g)||[]).length;setStatus(id,`Writing cards${pl}\u2026 ${made.length+k} so far`);});
    const obj=parseLoose(raw);
    for(const x of obj.cards||[]){
      if(!x||!x.front||!x.back)continue;
      const key=(String(x.label||'')+'|'+x.front).toLowerCase();
      if(made.some(k=>(String(k.label||'')+'|'+k.front).toLowerCase()===key))continue;
      made.push({id:uid('k'),type:String(x.type||'result').toLowerCase(),label:String(x.label||''),front:String(x.front),back:String(x.back),hint:String(x.hint||''),page:parseInt(x.page)||null});
    }
  }
  if(!made.length)throw new Error('no cards came back');
  const cur=S.chapters[id];if(!cur)return;
  const old=cur.cards||[];
  for(const k of made){const o=old.find(z=>z.sr&&((z.label&&z.label===k.label)||z.front===k.front));if(o)k.sr=o.sr;}
  cur.cards=made;cur.error='';cur.generated=Date.now();putChapter(cur);
  toast(`${plural(made.length,'card')} made for ${cur.title}`);
}

/* ---------- study session ---------- */
let sess=null;
function startSession(mode,f){
  let items;
  if(mode==='cram'){const c=S.chapters[f.chapterId];items=(c.cards||[]).map(k=>({ch:c.id,id:k.id}));for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}}
  else items=buildQueue(f).items;
  if(!items.length){toast('Nothing to review here right now');return;}
  sess={mode,items,i:0,shown:false,done:0};
  $('#study').hidden=false;showCard();
}
function showCard(){
  const wrap=$('#cardwrap'),g=$('#grades');
  if(sess.i>=sess.items.length){
    $('#sbar').style.width='100%';$('#scount').textContent='';
    const sk=streak();
    wrap.innerHTML=`<article class="index" style="cursor:default"><div class="q">Done</div><div class="a">${plural(sess.done,'answer')} this session.${sess.mode==='review'&&sk>1?' '+plural(sk,'day')+' in a row.':''}</div></article>`;
    g.className='grades two';g.innerHTML=`<button class="wide" data-act="study-close">Finish</button>`;return;
  }
  const it=sess.items[sess.i];const[c,k]=findCard(it);
  if(!k){sess.i++;return showCard();}
  sess.shown=false;sess.choices=null;sess.picked=null;
  $('#sbar').style.width=Math.round(sess.i/sess.items.length*100)+'%';
  $('#scount').textContent=`${sess.i+1} / ${sess.items.length}`;
  const opts=wantsChoices(k)?buildChoices(c,k):null;
  if(opts){
    sess.choices=opts;
    wrap.innerHTML=`<article class="index" style="cursor:default">
    <div class="meta"><span class="type">${esc(cap(k.type))} <span class="modebadge">multiple choice</span></span><span>${esc(k.label)}</span></div>
    <div class="q">${esc(k.front)}</div>
    <p class="pick-note">Choose the correct answer.</p>
    <div class="choices">${opts.map((o,i)=>`<button class="choice" data-act="choose" data-i="${i}"><span class="verdict" hidden></span><span class="ctext">${esc(o.t)}</span></button>`).join('')}</div>
    <div class="hint" id="hint" hidden>${esc(k.hint||'')}</div>
    <div class="src" id="src" hidden>${esc(c.title)}${k.page?`, p.${k.page}`:''}</div></article>`;
    wrap.scrollTop=0;typeset(wrap);
    g.className='grades two';g.innerHTML='';return;
  }
  wrap.innerHTML=`<article class="index" data-act="flip" aria-label="Flashcard. Tap to show the answer.">
    <div class="meta"><span class="type">${esc(cap(k.type))}</span><span>${esc(k.label)}</span></div>
    <div class="q">${esc(k.front)}</div>
    <div class="a hidden-ans" id="ans">${esc(k.back)}</div>
    <div class="hint" id="hint" hidden>${esc(k.hint||'')}</div>
    <div class="src" id="src" hidden>${esc(c.title)}${k.page?`, p.${k.page}`:''}</div>
    <p class="reveal-note" id="rnote">Tap to show answer</p></article>`;
  wrap.scrollTop=0;typeset(wrap);
  g.className='grades two';g.innerHTML=`<button class="wide" data-act="flip">Show answer</button>`;
}
function reveal(){
  if(!sess||sess.shown||sess.i>=sess.items.length)return;sess.shown=true;
  const a=$('#ans');a.classList.remove('hidden-ans');a.classList.add('reveal');const rn=$('#rnote');if(rn)rn.remove();
  const h=$('#hint');if(h.textContent.trim())h.hidden=false;$('#src').hidden=false;
  const g=$('#grades');const[,k]=findCard(sess.items[sess.i]);
  if(sess.mode==='cram'){g.className='grades two';g.innerHTML=`<button class="g0" data-act="grade" data-g="0">Again<small>see it again</small></button><button class="g2" data-act="grade" data-g="2">Got it<small>next card</small></button>`;}
  else{g.className='grades';g.innerHTML=['Again','Hard','Good','Easy'].map((n,i)=>`<button class="g${i}" data-act="grade" data-g="${i}">${n}<small>${fmtIv(nextSr(k.sr,i).interval)}</small></button>`).join('');}
}
function choose(i){
  if(!sess||sess.shown||!sess.choices)return;
  sess.shown=true;sess.picked=i;
  const ok=sess.choices[i].ok;
  document.querySelectorAll('.choice').forEach((b,j)=>{
    b.disabled=true;const o=sess.choices[j];const v=b.querySelector('.verdict');
    if(o.ok){b.classList.add('right');v.hidden=false;v.textContent=j===i?'Correct':'Correct answer';}
    else if(j===i){b.classList.add('wrong');v.hidden=false;v.textContent='Your answer';}
  });
  const h=$('#hint');if(h.textContent.trim())h.hidden=false;$('#src').hidden=false;
  if(!ok){const r=document.querySelector('.choice.right');if(r)r.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
  const[,k]=findCard(sess.items[sess.i]);
  const g=$('#grades');g.className='grades two';
  let sub='';
  if(sess.mode==='review'){const nx=nextSr(k.sr,ok?2:0);sub=ok?(styleSetting()==='auto'&&nx.reps>=GRADUATE?`Next time as a flashcard, in ${fmtIv(nx.interval)}`:`Due again in ${fmtIv(nx.interval)}`):'You\u2019ll see this again today';}
  else sub=ok?'Next card':'You\u2019ll see this again';
  g.innerHTML=`<button class="wide" data-act="grade" data-g="${ok?2:0}">Continue<small style="color:inherit;opacity:.8">${sub}</small></button>`;
  const btn=g.querySelector('button');if(btn)btn.focus({preventScroll:true});
}
function grade(gv){
  if(!sess||!sess.shown)return;
  const it=sess.items[sess.i];const[c,k]=findCard(it);
  if(k&&sess.mode==='review'){
    const wasNew=!k.sr;k.sr=nextSr(k.sr,gv);
    const ds=dayStat();ds.reviews=(ds.reviews||0)+1;if(wasNew)ds.new=(ds.new||0)+1;
    putChapterSoon(c);putStats();
  }
  if(gv===0)sess.items.push(it);
  sess.done++;sess.i++;showCard();
}
function closeStudy(){$('#study').hidden=true;flushSoon();sess=null;render();}

/* ---------- add-notes flow ---------- */
async function onFile(file){
  const d=S.draft||(S.draft={stage:'pick'});
  if(!d.moduleId&&!(d.name||'').trim())d.name=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
  if(d.moduleId&&S.modules[d.moduleId])d.name=S.modules[d.moduleId].name;
  d.fileName=file.name;d.stage='working';d.progress=0;d.msg='Opening file\u2026';render();
  const upd=(p,msg)=>{d.progress=p;d.msg=msg;const bar=document.querySelector('main .meter>i');if(bar)bar.style.width=Math.round(p*100)+'%';const m=document.querySelector('[data-status="draft"]');if(m)m.textContent=msg;};
  try{
    const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';
    d.pages=isPdf?await readPdf(file,upd):await readText(file);
    const chars=d.pages.join('').replace(/\s/g,'').length;
    if(chars<300)throw new Error('This file has almost no readable text. It may be a scanned PDF. Try a PDF made from LaTeX, or a text file.');
    if(SAMPLE){upd(1,'Finding the chapters\u2026');await runDetect(d);}
    else{d.chapters=[{title:d.name||'Notes',start:1,end:d.pages.length}];d.detectNote='';}
    d.stage='review';
  }catch(e){toast(e.message||'Couldn\u2019t read that file');d.stage='pick';}
  render();
}
async function runDetect(d){
  try{d.chapters=await detectChapters(d);d.detectNote=`Found ${plural(d.chapters.length,'chapter')}.`;}
  catch(e){d.chapters=[{title:d.name||'Notes',start:1,end:d.pages.length}];d.detectNote='Couldn\u2019t find chapters automatically, so the whole file is one chapter for now.';}
}
function saveDraft(){
  const d=S.draft;const n=d.pages.length;
  const rows=d.chapters.map(c=>({title:(c.title||'').trim()||'Untitled',start:Math.max(1,Math.min(n,+c.start||1)),end:Math.max(1,Math.min(n,+c.end||n))})).map(c=>c.end<c.start?{...c,end:c.start}:c);
  let m=d.moduleId&&S.modules[d.moduleId];
  if(!m){m={id:uid('m'),name:(d.name||'').trim()||'Untitled module',created:Date.now()};putModule(m);}
  let order=chaptersOf(m.id).reduce((a,c)=>Math.max(a,c.order||0),0)+1;
  const ids=[];
  for(const r of rows){const c={id:uid('c'),moduleId:m.id,title:r.title,start:r.start,end:r.end,order:order++,cards:[],created:Date.now(),source:d.fileName};putText(c.id,chapterText(d.pages,r.start,r.end));putChapter(c);ids.push(c.id);}
  S.draft=null;tab='modules';nav={module:m.id,chapter:null};render();
  if(SAMPLE){ids.forEach(queueGen);toast('Making cards. You can keep using the app while this runs.');}
}

/* ---------- events ---------- */
function disarmLater(){clearTimeout(disarmLater._t);disarmLater._t=setTimeout(()=>{armed=null;if(!sess)render();},3500);}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  switch(el.dataset.act){
    case'tab':tab=el.dataset.tab;armed=null;render();$('#view').scrollTop=0;break;
    case'open-module':nav={module:el.dataset.id,chapter:null};armed=null;render();$('#view').scrollTop=0;break;
    case'open-chapter':nav.chapter=el.dataset.id;filterType='all';editing=null;armed=null;render();$('#view').scrollTop=0;break;
    case'up':if(nav.chapter)nav.chapter=null;else nav.module=null;armed=null;editing=null;render();break;
    case'review':startSession('review',el.dataset.chapter?{chapterId:el.dataset.chapter}:el.dataset.module?{moduleId:el.dataset.module}:{});break;
    case'cram':startSession('cram',{chapterId:el.dataset.chapter});break;
    case'flip':reveal();break;
    case'choose':choose(+el.dataset.i);break;
    case'style':S.stats.style=el.dataset.v;putStats();render();break;
    case'grade':grade(+el.dataset.g);break;
    case'study-close':closeStudy();break;
    case'npd':S.stats.newPerDay=Math.max(0,Math.min(200,(S.stats.newPerDay??20)+(+el.dataset.d)));putStats();render();break;
    case'filter':filterType=el.dataset.t;render();break;
    case'gen':{const c=S.chapters[el.dataset.id];if((c.cards||[]).length&&armed!=='regen'){armed='regen';render();disarmLater();break;}armed=null;queueGen(c.id);break;}
    case'gen-missing':chaptersOf(nav.module).filter(c=>!(c.cards||[]).length).forEach(c=>queueGen(c.id));break;
    case'add-to-module':S.draft={stage:'pick',moduleId:nav.module};tab='add';render();break;
    case'edit':editing=el.dataset.id;render();break;
    case'cancel-edit':editing=null;render();break;
    case'save-edit':{const c=S.chapters[nav.chapter];const k=c.cards.find(z=>z.id===el.dataset.id);const box=el.closest('.cl');for(const f of['label','front','back','hint'])k[f]=box.querySelector(`[data-edit="${f}"]`).value;editing=null;putChapter(c);render();toast('Card saved');break;}
    case'del-card':{const id=el.dataset.id;if(armed!=='card:'+id){armed='card:'+id;render();disarmLater();break;}const c=S.chapters[nav.chapter];c.cards=c.cards.filter(z=>z.id!==id);armed=null;putChapter(c);render();break;}
    case'del-chapter':if(armed!=='del-chapter'){armed='del-chapter';render();disarmLater();break;}armed=null;delChapter(nav.chapter);nav.chapter=null;render();toast('Chapter deleted');break;
    case'del-module':if(armed!=='del-module'){armed='del-module';render();disarmLater();break;}armed=null;delModule(nav.module);nav={module:null,chapter:null};render();toast('Module deleted');break;
    case'dr-del':S.draft.chapters.splice(+el.dataset.i,1);render();break;
    case'dr-add':{const d=S.draft,last=d.chapters[d.chapters.length-1];const s=last?Math.min(d.pages.length,last.end+1):1;d.chapters.push({title:'New chapter',start:s,end:d.pages.length});render();break;}
    case'dr-detect':{const d=S.draft;d.stage='working';d.msg='Finding the chapters\u2026';d.progress=1;render();runDetect(d).then(()=>{d.stage='review';render();});break;}
    case'dr-save':saveDraft();break;
    case'dr-reset':S.draft=null;render();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target,b=el.dataset.bind;if(!b)return;
  if(b==='draft-file'){const f=el.files&&el.files[0];if(f)onFile(f);return;}
  if(b==='draft-module'){S.draft={stage:'pick',moduleId:el.value||null,name:el.value?'':(S.draft&&S.draft.name)||''};render();return;}
  if(b==='rename-module'){const m=S.modules[nav.module];const v=el.value.trim();if(m&&v&&v!==m.name){m.name=v;putModule(m);}return;}
  if(b==='rename-chapter'){const c=S.chapters[nav.chapter];const v=el.value.trim();if(c&&v&&v!==c.title){c.title=v;putChapter(c);}return;}
  if(b==='api-key'||b==='api-model'){try{const k=b==='api-key'?API_KEY:API_MODEL;const v=el.value.trim();v?localStorage.setItem(k,v):localStorage.removeItem(k);}catch(err){}SAMPLE=apiSample();render();toast(b==='api-key'?(SAMPLE?'API key saved':'API key removed'):'Model saved');return;}
  if(b==='dr-start'||b==='dr-end'){const c=S.draft.chapters[+el.dataset.i];c[b==='dr-start'?'start':'end']=parseInt(el.value)||1;render();}
});
document.addEventListener('input',e=>{
  const el=e.target,b=el.dataset.bind;if(!b)return;
  if(b==='draft-name')(S.draft||(S.draft={stage:'pick'})).name=el.value;
  if(b==='dr-title')S.draft.chapters[+el.dataset.i].title=el.value;
});
document.addEventListener('keydown',e=>{
  if(!sess||e.target.matches('input,textarea'))return;
  if(sess.choices){
    if(!sess.shown&&/^[1-4]$/.test(e.key))choose(+e.key-1);
    else if(sess.shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();grade(sess.choices[sess.picked].ok?2:0);}
  }
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();sess.shown?grade(2):reveal();}
  else if(sess.shown&&/^[1-4]$/.test(e.key)){const g=+e.key-1;grade(sess.mode==='cram'?(g===0?0:2):g);}
  else if(e.key==='Escape')closeStudy();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSoon();});

render();initRuntime();
</script>
